[metadata]
format.version = "1.1"

[versions]
auth0 = "4.6.2"
caffeine = "3.3.1"
coroutines = "1.11.0"
httpclient5 = "5.6.4"
jacksonDatatype = "2.23.0"
jacksonAnnotations = "2.23"
jacksonTools = "3.3.0"
jwksRsa = "0.24.2"
junit = "6.1.3"
junitJupiter = "6.1.3"
kotest = "6.2.7"
kotlin = "2.4.21"
kotlinLogging = "8.0.7"
ktor = "3.6.1"
logback = "1.6.7"
mockk = "1.14.12"
netty = "4.2.17.Final"
nimbusds = "10.10"

[libraries]

caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine"}

jackson-moduleKotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jacksonDatatype" }
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jacksonAnnotations" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jacksonDatatype" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jacksonDatatype" }
jackson-toolsCore = { group = "tools.jackson.core", name = "jackson-core", version.ref = "jacksonTools" }
jackson-toolsDatabind = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jacksonTools" }

junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }

junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

kotest-runner = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertionsCore = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-assertionsShared = { group = "io.kotest", name = "kotest-assertions-shared", version.ref = "kotest" }
kotest-common = { group = "io.kotest", name = "kotest-common", version.ref = "kotest" }

kotlinLogging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "kotlinLogging" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-contentNegotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }

ktor-client-apache5 = { group = "io.ktor", name = "ktor-client-apache5", version.ref = "ktor" }
ktor-client-contentNegotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }

ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" }
ktor-io = { group = "io.ktor", name = "ktor-io", version.ref = "ktor" }
ktor-serialization = { group = "io.ktor", name = "ktor-serialization", version.ref = "ktor" }
ktor-serialization-jackson = { group = "io.ktor", name = "ktor-serialization-jackson", version.ref = "ktor" }
ktor-utils = { group = "io.ktor", name = "ktor-utils", version.ref = "ktor" }

ktor-test-clientMock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-test-server = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockkCore = { group = "io.mockk", name = "mockk-core", version.ref = "mockk" }
mockkDsl = { group = "io.mockk", name = "mockk-dsl", version.ref = "mockk" }

nimbusds-jose = { group = "com.nimbusds", name = "nimbus-jose-jwt", version.ref = "nimbusds" }
nimbusds-oauth2OidcSdk = { group = "com.nimbusds", name = "nimbus-jose-jwt", version.ref = "nimbusds" }

auth0-javaJwt = { group = "com.auth0", name = "java-jwt", version.ref = "auth0" }
auth0-jwksRsa = { group = "com.auth0", name = "jwks-rsa", version.ref = "jwksRsa" }
apache-httpclient5 = { group = "org.apache.httpcomponents.client5", name = "httpclient5", version.ref = "httpclient5" }

netty-common = { group = "io.netty", name = "netty-common", version.ref = "netty" }
netty-handler = { group = "io.netty", name = "netty-handler", version.ref = "netty" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
